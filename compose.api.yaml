# Backend-only development infrastructure. Full application Compose is A-04.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      CQA_DATABASE_URL: sqlite:////srv/cqa/data/private/cqa.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - cqa-data:/srv/cqa/data/private
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  cqa-data:
