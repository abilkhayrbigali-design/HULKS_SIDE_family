name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-contracts:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install '${{ matrix.python-version }}'
      - run: uv sync --project backend --locked --python '${{ matrix.python-version }}'
      - run: make check-api
      - run: uv run --project backend --locked python tools/smoke_app.py --api-only
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: make check-web
      - name: Install Chromium for workspace regression tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise CQA workspace in Chromium
        working-directory: frontend
        run: npm run test:e2e
  full-application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make setup
      - run: make build smoke
  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and probe backend container
        shell: bash
        run: |
          trap 'docker compose down --volumes' EXIT
          docker compose up --build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/ -o /dev/null
          curl --fail http://127.0.0.1:8000/api/v1/checklists -o /dev/null
