name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-contracts:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install '${{ matrix.python-version }}'
      - run: uv sync --project backend --locked --python '${{ matrix.python-version }}'
      - run: make check
      - name: Start API and probe database health
        shell: bash
        run: |
          uv run --project backend --locked uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/health
  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and probe backend container
        shell: bash
        run: |
          trap 'docker compose -f compose.api.yaml down --volumes' EXIT
          docker compose -f compose.api.yaml up --build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:8000/health
